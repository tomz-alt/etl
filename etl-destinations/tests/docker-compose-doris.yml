version: '3.8'

services:
  doris-fe:
    image: apache/doris:2.1.0-fe-x86_64
    container_name: doris-fe-test
    hostname: doris-fe
    environment:
      - FE_SERVERS=fe1:doris-fe:9010
      - FE_ID=1
    ports:
      - "8030:8030"  # HTTP port for StreamLoad
      - "9030:9030"  # MySQL protocol port
    volumes:
      - doris-fe-data:/opt/apache-doris/fe/doris-meta
    networks:
      - doris-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  doris-be:
    image: apache/doris:2.1.0-be-x86_64
    container_name: doris-be-test
    hostname: doris-be
    environment:
      - FE_SERVERS=fe1:doris-fe:9010
      - BE_ADDR=doris-be:9050
    depends_on:
      doris-fe:
        condition: service_healthy
    ports:
      - "8040:8040"  # BE webserver port
    volumes:
      - doris-be-data:/opt/apache-doris/be/storage
    networks:
      - doris-network

networks:
  doris-network:
    driver: bridge

volumes:
  doris-fe-data:
  doris-be-data:
